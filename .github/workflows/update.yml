name: Cap nhat phu tai NSMO

on:
  schedule:
    - cron: "17 2 * * *"   # 09:17 giờ VN
    - cron: "47 5 * * *"   # 12:47 giờ VN – chạy bù nếu sáng NSMO chưa có số liệu
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lay so lieu tu NSMO
        if: github.event_name != 'push'
        run: python scripts/fetch_nsmo.py

      - name: Commit so lieu moi
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Cap nhat phu tai $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
