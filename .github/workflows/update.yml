name: Cap nhat phu tai NSMO

on:
  schedule:
    - cron: "17 2 * * *"   # 09:17 giờ VN
    - cron: "47 5 * * *"   # 12:47 giờ VN – chạy bù nếu sáng NSMO chưa có số liệu
  workflow_dispatch:
    inputs:
      tu_ngay:
        description: "Lấy/bù số liệu từ ngày (yyyy-mm-dd)"
        required: false
        default: "2026-01-01"
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bước 1: lấy số liệu trên máy Windows tại VN (self-hosted runner), vì NSMO chặn máy chủ nước ngoài.
  fetch:
    if: github.event_name != 'push'
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      NSMO_START: ${{ github.event.inputs.tu_ngay || '2026-01-01' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Lay so lieu tu NSMO
        run: python -u scripts/fetch_nsmo.py

      - name: Commit so lieu moi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Cap nhat phu tai $(Get-Date -Format yyyy-MM-dd)"
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Output "Khong co thay doi."
          }
          exit 0

      - name: Xuat Excel vao OneDrive
        continue-on-error: true
        env:
          EXCEL_DIR: 'D:\OneDrive\P.HTD\3. Planning\Hien huu\So lieu Web NSMO'
        run: python -u scripts/export_excel.py

  # Bước 2: đăng trang lên GitHub Pages (máy của GitHub).
  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
